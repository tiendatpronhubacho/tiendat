workflows:
  ios-unsigned-build:
    name: iOS Unsigned Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "ThreeOneOSFive.xcodeproj"
        XCODE_SCHEME: "ThreeOneOSFive" # Hoặc "3106" tùy vào Scheme bạn đặt trong Xcode
        BUILD_DIR: "build_output"
    scripts:
      - name: Set Xcode version
        script: |
          echo "Xcode version:"
          xcodebuild -version
          
      - name: Build unsigned IPA
        script: |
          # Gọi script build unsigned có sẵn trong repo
          chmod +x ./build_unsigned.sh
          ./build_unsigned.sh
          
      - name: Prepare eSign IPA
        script: |
          # Gọi script đóng gói eSign (nếu bạn muốn dùng)
          # Script này sẽ tìm file IPA trong thư mục build
          chmod +x ./build_esign_ready_ipa.sh
          ./build_esign_ready_ipa.sh ./build/OGIOS-unsigned.ipa
    artifacts:
      - build/*.ipa
      - build_output/**/*.app