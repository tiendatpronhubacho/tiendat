workflows:
  ios-unsigned-ipa:
    name: TienDat - OGIOS Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:
      - name: Check Xcode and project scheme
        script: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -list -project ThreeOneOSFive.xcodeproj

      - name: Build unsigned IPA
        script: |
          set -euo pipefail
          chmod +x ./build_unsigned.sh
          ./build_unsigned.sh

      - name: Verify eSign-ready IPA
        script: |
          set -euo pipefail
          IPA="build/HYper-Regedit-Key-Enabled-unsigned.ipa"
          test -f "$IPA"
          chmod +x ./build_esign_ready_ipa.sh
          ./build_esign_ready_ipa.sh "$IPA"

    artifacts:
      - build/HYper-Regedit-Key-Enabled-unsigned.ipa
