workflows:
  ios-trollstore-build:
    name: Build 3105 IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "ThreeOneOSFive.xcodeproj"
        XCODE_TARGET: "ThreeOneOSFive" 
    scripts:
      - name: Build archive without signing
        script: |
          # Bỏ -derivedDataPath, build mặc định
          xcodebuild -project "$XCODE_PROJECT" \
                     -target "$XCODE_TARGET" \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build
                     
      - name: Package into IPA
        script: |
          mkdir -p Payload
          
          # Tìm thư mục build mặc định của Xcode và copy file .app
          # Thư mục mặc định thường là ~/Library/Developer/Xcode/DerivedData/
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" -path "*Release-iphoneos*" -exec cp -r {} Payload/ \;
          
          # Nén thành file .ipa
          zip -r TienDat.ipa Payload
          
    artifacts:
      - TienDat.ipa