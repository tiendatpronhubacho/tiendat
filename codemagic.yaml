workflows:
  tiendat-unsigned-ipa:
    name: TienDat unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    scripts:
      - name: Build iOS app without code signing
        script: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild \
            -project OriginalXcode/ThreeOneOSFive.xcodeproj \
            -scheme OGIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/TienDatDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build
      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          APP_PATH="$CM_BUILD_DIR/TienDatDerivedData/Build/Products/Release-iphoneos/OGIOS.app"
          test -d "$APP_PATH"
          mkdir -p "$CM_BUILD_DIR/ipa/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/ipa/Payload/OGIOS.app"
          (cd "$CM_BUILD_DIR/ipa" && /usr/bin/zip -qry "$CM_BUILD_DIR/TienDat-unsigned.ipa" Payload)
          test -s "$CM_BUILD_DIR/TienDat-unsigned.ipa"
    artifacts:
      - $CM_BUILD_DIR/TienDat-unsigned.ipa
