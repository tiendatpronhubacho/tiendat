workflows:
  ios-trollstore-build:
    name: Build 3105 IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "ThreeOneOSFive.xcodeproj"
        # Không dùng scheme nữa, dùng target trực tiếp
        XCODE_TARGET: "ThreeOneOSFive" 
    scripts:
      - name: Build archive without signing
        script: |
          rm -rf build
          
          # Dùng -target thay vì -scheme
          xcodebuild -project "$XCODE_PROJECT" \
                     -target "$XCODE_TARGET" \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build
                     
      - name: Package into IPA
        script: |
          mkdir -p Payload
          
          # Copy file .app vào Payload
          mv build/Build/Products/Release-iphoneos/*.app Payload/
          
          # Nén thành file .ipa
          zip -r TienDat.ipa Payload
          
    artifacts:
      - TienDat.ipa