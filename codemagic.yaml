workflows:
  xtool-build:
    name: Build xtool IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      - name: Install xtool
        script: |
          set -e
          brew install xtool-org/tap/xtool
      - name: Build
        script: |
          set -e
          xtool dev build --ipa
    artifacts:
      - xtool/**/*.ipa
      - "*.ipa"
