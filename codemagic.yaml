workflows:
  ios-trollstore-build:
    name: Build 3106 IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "ThreeOneOSSix.xcodeproj"
        XCODE_TARGET: "3106"
    scripts:
      - name: Build archive without signing
        script: |
          rm -rf build_output
          
          xcodebuild -project "$XCODE_PROJECT" \
                     -target "$XCODE_TARGET" \
                     -configuration Release \
                     -sdk iphoneos \
                     SYMROOT="$(pwd)/build_output" \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build
                     
      - name: Package into IPA
        script: |
          mkdir -p Payload
          
          APP_PATH=$(find build_output -type d -name "*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "LỖI: Không tìm thấy file .app."
            exit 1
          fi
          
          cp -r "$APP_PATH" Payload/
          zip -r TienDat_3106.ipa Payload
          
    artifacts:
      - TienDat_3106.ipa