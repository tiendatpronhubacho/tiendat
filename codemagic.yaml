workflows:
  ios-trollstore-build:
    name: Build 3105 IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "ThreeOneOSFive.xcodeproj"
        XCODE_SCHEME: "ThreeOneOSFive"
    scripts:
      - name: Build archive without signing
        script: |
          xcodebuild -project "$XCODE_PROJECT" \
                     -scheme "$XCODE_SCHEME" \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build
      - name: Package into IPA
        script: |
          mkdir -p Payload
          mv build/Build/Products/Release-iphoneos/ThreeOneOSFive.app Payload/
          zip -r ThreeOneOSFive.ipa Payload
    artifacts:
      - ThreeOneOSFive.ipa