workflows:
  ios-trollstore-build:
    name: Build 3105 IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "ThreeOneOSFive.xcodeproj"
        XCODE_TARGET: "3105"
    scripts:
      - name: Build archive without signing
        script: |
          rm -rf build
          
          # Dùng -target để ép build đúng target 3105
          xcodebuild -project "$XCODE_PROJECT" \
                     -target "$XCODE_TARGET" \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build
                     
      - name: Package into IPA
        script: |
          mkdir -p Payload
          
          # Đường dẫn này khớp với -derivedDataPath build ở trên
          # Copy file app vào Payload
          find build/Build/Products/Release-iphoneos -name "*.app" -exec cp -r {} Payload/ \;
          
          # Zip lại thành file ipa
          zip -r TienDat.ipa Payload
          
    artifacts:
      - TienDat.ipa