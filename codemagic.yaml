workflows:
  xtool-build:
    name: Build xtool IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      - name: Install xtool
        script: |
          brew install xtool-org/tap/xtool || true
      - name: Build
        script: |
          if command -v xtool >/dev/null 2>&1; then
            xtool dev build --ipa || true
          fi
    artifacts:
      - xtool/**/*.ipa
      - "*.ipa"
      - .build/release/**
