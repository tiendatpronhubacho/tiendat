workflows:
  ios-trollstore-build:
    name: Build 3105 IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "ThreeOneOSFive.xcodeproj"
        XCODE_TARGET: "3105"
    scripts:
      - name: Build archive without signing
        script: |
          rm -rf build_output
          
          # Sử dụng biến SYMROOT để ép thư mục build
          xcodebuild -project "$XCODE_PROJECT" \
                     -target "$XCODE_TARGET" \
                     -configuration Release \
                     -sdk iphoneos \
                     SYMROOT="$(pwd)/build_output" \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build
                     
      - name: Package into IPA
        script: |
          mkdir -p Payload
          
          # Tìm file .app ngay trong thư mục build_output vừa tạo
          APP_PATH=$(find build_output -type d -name "*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "LỖI: Không tìm thấy file .app. Dưới đây là cấu trúc thư mục build_output:"
            find build_output -maxdepth 3
            exit 1
          fi
          
          echo "Tìm thấy app tại: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          
          zip -r TienDat.ipa Payload
          
    artifacts:
      - TienDat.ipa